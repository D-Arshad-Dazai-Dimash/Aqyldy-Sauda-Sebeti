services:
  db:
    image: postgres:16
    container_name: aqyldy_sauda_sebeti__db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dbaqyldy
      POSTGRES_USER: aqsa
      POSTGRES_PASSWORD: aqyldysebet123
    ports:
      - "55432:5432"
    volumes:
      - aqyldy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqsa -d dbaqyldy"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-service:
    build: ./ai-service
    container_name: aqyldy_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: dbaqyldy
      DB_USER: aqsa
      DB_PASS: aqyldysebet123
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  aqyldy_pg: