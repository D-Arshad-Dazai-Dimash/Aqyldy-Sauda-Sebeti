spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://*.onrender.com}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
    public-base-url: ${UPLOADS_PUBLIC_BASE_URL:/uploads}
  password-reset:
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
  rate-limit:
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}
  security:
    expose-dev-reset-token: false

logging:
  level:
    com.darshad.project: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
    org.flywaydb: INFO

springdoc:
  swagger-ui:
    path: /swagger
    display-request-duration: true
    doc-expansion: none
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    persist-authorization: true
  api-docs:
    path: /api-docs