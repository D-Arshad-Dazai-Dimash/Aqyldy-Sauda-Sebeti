spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}

# DigitalOcean Spaces (S3-compatible) for product images.
# Falls back to inline base64 in DB if any of the required vars is missing.
spaces:
  endpoint: ${SPACES_ENDPOINT:}
  region: ${SPACES_REGION:}
  bucket: ${SPACES_BUCKET:}
  key: ${SPACES_KEY:}
  secret: ${SPACES_SECRET:}
  public-base: ${SPACES_PUBLIC_BASE:}


