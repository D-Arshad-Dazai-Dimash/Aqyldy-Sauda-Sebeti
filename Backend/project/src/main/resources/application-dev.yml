server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-env-var}
    access-ttl-minutes: 60

  # Show SQL params (dev only)
  jpa.properties.hibernate.format_sql: true

logging:
  level:
    com.darshad.project: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /api-docs