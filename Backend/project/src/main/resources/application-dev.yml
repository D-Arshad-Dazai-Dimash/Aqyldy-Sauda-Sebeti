spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://10.0.2.2:8080,http://localhost:19006}
  jwt:
    secret: ${JWT_SECRET:dev-secret-at-least-32-chars-long!!}
    access-ttl-minutes: 60
    refresh-ttl-days: 30
  password-reset:
    ttl-minutes: 30
  rate-limit:
    # Window-based limiter for /api/auth/login + /api/auth/register.
    # Counts per remote IP, resets every window.
    window-seconds: 60
    max-requests: 10
  security:
    expose-dev-reset-token: true

logging:
  level:
    com.darshad.project: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG

springdoc:
  swagger-ui:
    path: /swagger
    display-request-duration: true
    doc-expansion: none
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    persist-authorization: true
  api-docs:
    path: /api-docs