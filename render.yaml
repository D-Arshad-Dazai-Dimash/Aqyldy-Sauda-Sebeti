services:
  - type: web
    name: aqyldy-backend
    env: java
    rootDir: Backend/project
    plan: free
    buildCommand: ./gradlew clean build -x test
    startCommand: java -jar build/libs/project-0.0.1-SNAPSHOT.jar
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_VERSION
        value: 17
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: aqyldy-ai-service
    env: docker
    rootDir: ai-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: pserv
    name: aqyldy-postgres
    plan: free
    databaseName: dbaqyldy
    user: aqsa
